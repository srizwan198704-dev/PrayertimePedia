name: Update Prayer Times (All 234 Countries)

on:
  schedule:
    - cron: '0 */6 * * *'  # প্রতি ৬ ঘণ্টা পর পর
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run bulk scraper (All cities from country.json)
        run: |
          python scraper_bulk_all_cities.py

      - name: Commit and push updated JSONs
        run: |
          git config --global user.name "Prayer Times Bot"
          git config --global user.email "bot@muslimbangla.com"
          git add data/
          git diff --staged --quiet || git commit -m "🕌 Auto update prayer times for all cities - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "✅ Updated $(find data -name '*.json' | wc -l) city files"
          ls -R data | head -n 100
